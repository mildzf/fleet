{# Shared mobile-first styles for the fleet pages. Included at the top of each page's content block. #}
<style>
.fleet{max-width:960px;margin:0 auto;padding:0 12px 24px;box-sizing:border-box}
.fleet *,.fleet *::before,.fleet *::after{box-sizing:border-box}
.fleet h1{font-size:1.4rem;margin:.7em 0 .4em;line-height:1.25}
.fleet h2{font-size:1.15rem;margin:1.5em 0 .5em}
.fleet h3{font-size:1rem;margin:1.2em 0 .4em;opacity:.8}
.fleet p{line-height:1.5}
.fleet a{overflow-wrap:anywhere}

/* Forms: 16px inputs stop iOS zooming in on focus; 44px tap targets */
.fleet input[type=text],.fleet input[type=number],.fleet input[type=date],
.fleet input[type=datetime-local],.fleet select,.fleet textarea{
  width:100%;font-size:16px;padding:10px;min-height:44px;border:1px solid #888;border-radius:8px;
  background:Canvas;color:CanvasText}
.fleet textarea{min-height:72px}
.fleet label{display:block;font-weight:600;margin:12px 0 4px}
.fleet .errorlist{color:#b91c1c;list-style:none;padding:0;margin:4px 0;font-size:.9rem}
.fleet .helptext{opacity:.7;font-size:.85rem}

/* Buttons */
.fleet .btn{display:inline-block;min-height:44px;padding:10px 16px;font-size:16px;border:1px solid #888;
  border-radius:8px;background:rgba(127,127,127,.12);color:inherit;text-decoration:none;cursor:pointer;text-align:center;
  touch-action:manipulation}
.fleet .btn-primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:600}
.fleet .btn-danger{color:#b91c1c;border-color:#b91c1c;background:transparent}
.fleet .btn-small{min-height:36px;padding:6px 12px;font-size:14px}
.fleet .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fleet .sticky-actions{position:sticky;bottom:0;background:Canvas;padding:10px 0;border-top:1px solid #8884;margin-top:20px;z-index:5}
.fleet .sticky-actions .btn{width:100%}

/* Tables */
.fleet table{width:100%;border-collapse:collapse}
.fleet th,.fleet td{padding:8px;text-align:left;border-bottom:1px solid #8883;vertical-align:top}

/* Status badges */
.fleet .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap}
.fleet .b-ok,.fleet .b-valid{background:#dcfce7;color:#166534}
.fleet .b-due_soon,.fleet .b-expiring{background:#fef3c7;color:#92400e}
.fleet .b-overdue,.fleet .b-expired{background:#fee2e2;color:#991b1b}
.fleet .b-no_history,.fleet .b-missing{background:#e5e7eb;color:#374151}

/* Small screens: tables become stacked cards (cells need data-label="...") */
@media (max-width:640px){
  .fleet table.stack thead{display:none}
  .fleet table.stack,.fleet table.stack tbody{display:block}
  .fleet table.stack tr{display:block;border:1px solid #8885;border-radius:10px;margin:0 0 10px;padding:6px 12px}
  .fleet table.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0;text-align:right}
  .fleet table.stack td::before{content:attr(data-label);font-weight:600;text-align:left;flex:0 0 38%}
  .fleet table.stack td[colspan]{display:block;text-align:left}
  .fleet table.stack td[colspan]::before{content:none}
  .fleet .btn-row .btn{flex:1 1 100%}
}
</style>
